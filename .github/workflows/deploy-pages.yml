name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare website files
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
        run: |
          mkdir -p _site/assets
          cp index.html _site/index.html
          cp qrcode_assignment/site/index.html _site/qrcode.html
          cp waitlist_project/waitlist.html _site/waitlist.html
          cp waitlist_project/staff.html _site/staff.html
          cp waitlist_project/styles.css _site/styles.css
          cp waitlist_project/api.js _site/api.js
          cp waitlist_project/app.js _site/app.js
          cp waitlist_project/staff.js _site/staff.js
          cp waitlist_project/assets/waitlist-qr.png _site/assets/waitlist-qr.png
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          source_config = json.loads(
              Path("waitlist_project/config.js")
              .read_text(encoding="utf-8")
              .split("=", 1)[1]
              .strip()
              .rstrip(";")
          )
          config = {
              "gasWebAppUrl": (
                  str(source_config.get("gasWebAppUrl", "")).rstrip("/")
                  or os.environ.get("GAS_WEB_APP_URL", "").rstrip("/")
              ),
              "publicPageUrl": "https://lucas950219.github.io/data_structure/waitlist.html",
              "staffPageUrl": "https://lucas950219.github.io/data_structure/staff.html",
              "pollIntervalMs": 5000,
          }
          Path("_site/config.js").write_text(
              "window.WAITLIST_CONFIG = " + json.dumps(config, ensure_ascii=False) + ";\n",
              encoding="utf-8",
          )
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
