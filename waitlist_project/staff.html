<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10151d">
  <title>員工候位管理｜好好候位</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; background: #10151d; }
    body { min-height: 100vh; }
    #app-frame { display: block; width: 100%; min-height: 100vh; border: 0; background: #10151d; }
    #launch-message { max-width: 640px; margin: 12vh auto; padding: 32px; color: #e8eef8; font: 16px/1.7 system-ui, sans-serif; }
    #launch-message h1 { margin-top: 0; font-size: 26px; }
    #launch-message code { color: #92c5ff; overflow-wrap: anywhere; }
  </style>
  <script src="config.js"></script>
</head>
<body>
  <main id="launch-message" role="status"><h1>員工候位管理</h1><p>正在連線到 Google Apps Script…</p></main>
  <iframe id="app-frame" title="員工候位管理" hidden></iframe>
  <script>
    (() => {
      const config = window.WAITLIST_CONFIG || {};
      const message = document.getElementById("launch-message");
      const frame = document.getElementById("app-frame");
      if (window.top !== window.self) {
        message.innerHTML = "<h1>員工候位管理</h1><p>請直接開啟官方員工管理網址，不要將管理頁嵌入其他網站。</p>";
        return;
      }
      const rawUrl = String(config.gasWebAppUrl || "").trim();
      if (!rawUrl) {
        message.innerHTML = "<h1>員工候位管理</h1><p>Apps Script 尚未部署或尚未設定網址。請完成部署後，在 GitHub Repository Variables 設定 <code>GAS_WEB_APP_URL</code>，再重新執行 Pages workflow。</p>";
        return;
      }
      let appUrl;
      try { appUrl = new URL(rawUrl); } catch {
        message.innerHTML = "<h1>員工候位管理</h1><p>Apps Script 網址格式不正確，請檢查 GitHub 的 <code>GAS_WEB_APP_URL</code> 設定。</p>";
        return;
      }
      if (appUrl.protocol !== "https:" || appUrl.hostname !== "script.google.com" || !appUrl.pathname.includes("/macros/s/") || !appUrl.pathname.endsWith("/exec")) {
        message.innerHTML = "<h1>員工候位管理</h1><p>請使用 Apps Script Web App 的 HTTPS <code>/exec</code> 部署網址。</p>";
        return;
      }
      appUrl.searchParams.set("view", "staff");
      appUrl.hash = window.location.hash;
      frame.addEventListener("load", () => {
        frame.contentWindow.postMessage({ type: "waitlist-parent-handshake" }, "*");
      });
      frame.src = appUrl.toString();
      frame.hidden = false;
      message.hidden = true;
    })();
  </script>
</body>
</html>
